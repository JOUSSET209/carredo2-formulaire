<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Carredo2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Formulaire Carredo2</h1>
    <form action="#" method="post">
        <div class="form-group">
            <label for="societe">Nom de la société :</label>
            <input type="text" id="societe" name="societe" required>
        </div>
        
        <div class="form-group">
            <label for="datetime">Date et heure de passage :</label>
            <input type="datetime-local" id="datetime" name="datetime" required>
        </div>
        
        <div class="form-group">
            <label for="commentaires">Commentaires :</label>
            <textarea id="commentaires" name="commentaires"></textarea>
        </div>
        
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
